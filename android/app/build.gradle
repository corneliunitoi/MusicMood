import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// One version for web and Android: read from package.json (e.g. 0.8.8d).
// versionCode must only ever go up on Google Play: 0.8.8 -> 80800, 0.8.8d -> 80804, 0.8.9 -> 80900, 1.0.0 -> 1000000.
def appVersionName = new JsonSlurper().parse(file('../../package.json')).version
def appVersionCode = { String v ->
    def m = (v =~ /^(\d+)\.(\d+)\.(\d+)([a-z]?)$/)
    if (!m.matches()) throw new GradleException("package.json version '${v}' must look like 0.8.9 or 0.8.9a")
    int letter = m.group(4) ? ((int) m.group(4).charAt(0)) - ((int) 'a'.charAt(0)) + 1 : 0
    return m.group(1).toInteger() * 1000000 + m.group(2).toInteger() * 10000 + m.group(3).toInteger() * 100 + letter
}(appVersionName)

// Signing: the upload key is never stored in the repository. CI (and the owner's PC) provide it
// through environment variables; see ANDROID_BUILD.md. Without them, debug builds fall back to
// Android's own debug key and release builds refuse to run (so an unsigned file can never be uploaded).
//   ANDROID_KEYSTORE_FILE      path to the .jks / .keystore file
//   ANDROID_KEYSTORE_PASSWORD  store password
//   ANDROID_KEY_ALIAS          key alias (default: musicmood)
//   ANDROID_KEY_PASSWORD       key password (default: the store password)
def keystoreFilePath = System.getenv('ANDROID_KEYSTORE_FILE')
def hasUploadKey = keystoreFilePath && file(keystoreFilePath).isFile() && System.getenv('ANDROID_KEYSTORE_PASSWORD')

android {
    namespace = "uk.co.musicmood"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "uk.co.musicmood"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            upload {
                storeFile file(keystoreFilePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'musicmood'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Same key as release when available, so test builds carry the SHA-1 registered for Google sign-in.
            if (hasUploadKey) signingConfig signingConfigs.upload
        }
        release {
            if (hasUploadKey) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package)\w*Release/ }
    if (wantsRelease && !hasUploadKey) {
        throw new GradleException('Release builds need the upload key: set ANDROID_KEYSTORE_FILE and ANDROID_KEYSTORE_PASSWORD (see ANDROID_BUILD.md).')
    }
}

// Output files are named after the version, e.g. MusicMood-0.8.8d-debug.apk
base {
    archivesName = "MusicMood-${appVersionName}"
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
