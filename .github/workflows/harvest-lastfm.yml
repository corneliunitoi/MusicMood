name: Last.fm Library Harvest Pipeline

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of missing artists to ingest (e.g. 50, 100, 1000, or 1500)'
        required: true
        type: number
        default: 1500
      tracks:
        description: 'Iconic tracks per artist'
        required: true
        type: number
        default: 10
      user:
        description: 'Last.fm username'
        required: true
        type: string
        default: 'octakhan888'
      pages:
        description: 'Number of Last.fm library pages to scan for missing bands'
        required: true
        type: number
        default: 35
      dry_run:
        description: 'Dry run mode (audit only, no database writes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  harvest:
    name: Harvest Missing Artists & Tracks
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INPUT_COUNT: ${{ github.event.inputs.count }}
      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
      INPUT_PAGES: ${{ github.event.inputs.pages }}
      INPUT_TRACKS: ${{ github.event.inputs.tracks }}
      INPUT_USER: ${{ github.event.inputs.user }}
    timeout-minutes: 360

    steps:
      - name: Require service-role key
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Repository secret SUPABASE_SERVICE_ROLE_KEY is missing. Catalog writes require it (clients are read/add-only since v0.8.7c)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Step 1 - Scrape Library & Refresh Missing Cache
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          echo "🔍 Scanning Last.fm library for @${INPUT_USER:-octakhan888}..."
          node scripts/scrapeLastFmArtists.js --user=${INPUT_USER:-octakhan888} --pages=${INPUT_PAGES:-35}

      - name: Step 2 - Harvest & Resolve Top Tracks into Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          COUNT=${INPUT_COUNT:-1500}
          TRACKS=${INPUT_TRACKS:-10}
          USER=${INPUT_USER:-octakhan888}
          DRY_RUN=${INPUT_DRY_RUN}

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 Ingesting in DRY-RUN mode ($COUNT artists, $TRACKS tracks each)..."
            node scripts/harvestLastFmArtists.js --count=$COUNT --tracks=$TRACKS --user=$USER --dry-run
          else
            echo "🚀 Ingesting LIVE into Supabase ($COUNT artists, $TRACKS tracks each)..."
            node scripts/harvestLastFmArtists.js --count=$COUNT --tracks=$TRACKS --user=$USER
          fi
