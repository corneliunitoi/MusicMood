name: Targeted Genre Inflation Pipeline

on:
  workflow_dispatch:
    inputs:
      genre:
        description: 'Target genre (blues, country, folk_acoustic, avant_garde, darksynth, gaps (nine thin sub-genres), or all; all excludes darksynth and gaps)'
        required: true
        type: choice
        options:
          - all
          - blues
          - country
          - folk_acoustic
          - avant_garde
          - darksynth
          - gaps
          - pfunk
          - nature_soundscape
        default: 'all'
      count:
        description: 'Number of artists to ingest per genre'
        required: true
        type: number
        default: 200
      tracks:
        description: 'Iconic tracks per artist'
        required: true
        type: number
        default: 5
      dry_run:
        description: 'Dry run mode (audit only, no database writes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  harvest-genre:
    name: Harvest Targeted Genre Artists
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INPUT_COUNT: ${{ github.event.inputs.count }}
      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
      INPUT_GENRE: ${{ github.event.inputs.genre }}
      INPUT_TRACKS: ${{ github.event.inputs.tracks }}
    timeout-minutes: 360

    steps:
      - name: Require service-role key
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Repository secret SUPABASE_SERVICE_ROLE_KEY is missing. Catalog writes require it (clients are read/add-only since v0.8.7c)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Targeted Genre Inflation
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          GENRE=${INPUT_GENRE:-all}
          COUNT=${INPUT_COUNT:-200}
          TRACKS=${INPUT_TRACKS:-5}
          DRY_RUN=${INPUT_DRY_RUN}

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 Running in DRY-RUN mode for $GENRE ($COUNT artists, $TRACKS tracks each)..."
            node scripts/harvestGenreArtists.js --genre=$GENRE --count=$COUNT --tracks=$TRACKS --dry-run
          else
            echo "🚀 Running LIVE into Supabase for $GENRE ($COUNT artists, $TRACKS tracks each)..."
            node scripts/harvestGenreArtists.js --genre=$GENRE --count=$COUNT --tracks=$TRACKS
          fi
