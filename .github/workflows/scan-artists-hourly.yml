name: Hourly Balanced Artist Discovery & Staging

on:
  schedule:
    # Runs at the top of every hour (24 times a day)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Discovery mode (balance: multi-genre library balancer; kexp: pure live radio; genre: single target)'
        required: true
        type: choice
        options:
          - balance
          - kexp
          - genre
        default: 'balance'
      count:
        description: 'Number of candidate artists to stage'
        required: true
        type: number
        default: 500
      genre:
        description: 'Target genre or tag (only if mode=genre)'
        required: false
        type: string
        default: 'blues'

permissions:
  contents: read

jobs:
  scan-artists:
    name: Scan & Stage Balanced Candidate Artists
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Balanced Artist Scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || 'd11784f5f2ef96e01a656f80734244e8' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'balance' }}"
          COUNT="${{ github.event.inputs.count || '500' }}"
          GENRE="${{ github.event.inputs.genre || 'blues' }}"

          echo "🔍 Scanning artists: mode=$MODE, count=$COUNT, genre=$GENRE..."
          node scripts/scanArtistCandidates.js --mode="$MODE" --count="$COUNT" --genre="$GENRE"
