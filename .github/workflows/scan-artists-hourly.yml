name: Hourly Artist Discovery & Staging

on:
  schedule:
    # Runs at the top of every hour (24 times a day)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Discovery mode (auto rotates KEXP and micro-tags)'
        required: true
        type: choice
        options:
          - auto
          - kexp
          - tag
        default: 'auto'
      count:
        description: 'Number of candidate artists to stage'
        required: true
        type: number
        default: 500
      tag:
        description: 'Target genre micro-tag (if source=tag)'
        required: false
        type: string
        default: 'delta blues'

permissions:
  contents: read

jobs:
  scan-artists:
    name: Scan & Stage Candidate Artists
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Artist Candidate Scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || 'd11784f5f2ef96e01a656f80734244e8' }}
        run: |
          SOURCE="${{ github.event.inputs.source || 'auto' }}"
          COUNT="${{ github.event.inputs.count || '500' }}"
          TAG="${{ github.event.inputs.tag || 'delta blues' }}"

          echo "🔍 Scanning artists: source=$SOURCE, count=$COUNT, tag=$TAG..."
          node scripts/scanArtistCandidates.js --source="$SOURCE" --count="$COUNT" --tag="$TAG"
