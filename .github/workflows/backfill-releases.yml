name: Backfill All GitHub Releases

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backfill-releases.yml'

permissions:
  contents: write

jobs:
  backfill:
    name: Backfill All GitHub Releases Since v0.5.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Backfill Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/backfillGitHubReleases.js
