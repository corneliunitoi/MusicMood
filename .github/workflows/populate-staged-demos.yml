name: Scheduled Staged Artist Demo Tracks Resolution

on:
  schedule:
    # Runs every 2 hours to steadily enrich uncataloged staged artists with demo tracks
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of staged artist demos to resolve in this run'
        required: true
        type: number
        default: 500

permissions:
  contents: read

jobs:
  populate-demos:
    name: Resolve & Populate Staged Artist Demos
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INPUT_LIMIT: ${{ github.event.inputs.limit }}
    timeout-minutes: 25

    steps:
      - name: Require service-role key
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Repository secret SUPABASE_SERVICE_ROLE_KEY is missing. Catalog writes require it (clients are read/add-only since v0.8.7c)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Staged Demo Resolution Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          LIMIT="${INPUT_LIMIT:-500}"
          echo "🎧 Resolving top signature demo tracks for staged artists (limit=$LIMIT)..."
          node scripts/populateStagedDemos.js --limit="$LIMIT"
