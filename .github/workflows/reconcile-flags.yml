name: Nightly Catalog Maintenance & Discovery Inflation

on:
  schedule:
    # Runs every night at 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode (audit only, no database writes)'
        required: false
        type: boolean
        default: false
      avatar_limit:
        description: 'Number of artist profile pictures to populate'
        required: false
        type: number
        default: 250

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile Flags & Disambiguate Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Heal Staged Artist Genres (Eliminate 'other')
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || 'd11784f5f2ef96e01a656f80734244e8' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 Running Staged Genre Healing in DRY-RUN mode..."
            node scripts/healStagedGenres.js --dry-run
          else
            echo "🚀 Healing unassigned genres in staged suggestions..."
            node scripts/healStagedGenres.js
          fi

      - name: Run Reclassification & Flag Healing
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 Running in DRY-RUN mode..."
            node scripts/reclassifyCatalog.js --loops=2
          else
            echo "🚀 Running with LIVE DB updates..."
            node scripts/reclassifyCatalog.js --apply --loops=2
          fi

      - name: Inflate Upvoted & Favorited Artists
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 Running Artist Inflation in DRY-RUN mode..."
            node scripts/inflateArtists.js --dry-run --limit=10 --max-tracks=10
          else
            echo "🚀 Inflating top upvoted artists..."
            node scripts/inflateArtists.js --limit=10 --max-tracks=10
          fi

      - name: Discover & Ingest Related Artists
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || 'd11784f5f2ef96e01a656f80734244e8' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 Running Related Artist Discovery in DRY-RUN mode..."
            node scripts/inflateRelatedArtists.js --dry-run --anchors=5 --similar=3 --tracks=5
          else
            echo "🚀 Ingesting related artists for top upvotes..."
            node scripts/inflateRelatedArtists.js --anchors=5 --similar=3 --tracks=5
          fi

      - name: Populate Missing Artist Avatars (Open-License)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wgrucrcdcpgvnxduftow.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LLIcnNawT3dcqz7k7ZkBVA_f5oxMIy6' }}
        run: |
          AVATAR_LIMIT="${{ github.event.inputs.avatar_limit || '250' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 Running Avatar Population in DRY-RUN mode (limit: $AVATAR_LIMIT)..."
            node scripts/populateArtistAvatars.js --limit="$AVATAR_LIMIT" --dry-run
          else
            echo "🚀 Populating artist profile pictures from open sources (limit: $AVATAR_LIMIT)..."
            node scripts/populateArtistAvatars.js --limit="$AVATAR_LIMIT"
          fi
